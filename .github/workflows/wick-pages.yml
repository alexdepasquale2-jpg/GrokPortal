name: Deploy Wick to Pages

on:
  push:
    branches: [feat/skyneet-survivors-design, main]
    paths:
      - "wick/**"
      - ".github/workflows/wick-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: wick/package-lock.json
      - run: npm ci
        working-directory: wick
      - run: npm test
        working-directory: wick
      - run: npm run build
        working-directory: wick
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: wick/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
