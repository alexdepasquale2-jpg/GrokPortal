<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="theme-color" content="#04050a" />
    <meta name="apple-mobile-web-app-title" content="WICK" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icon.svg" />
    <title>WICK — steal the last light</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="frame">
      <canvas id="game" width="960" height="540"></canvas>
      <div id="touch" hidden>
        <div id="stick" class="stick" aria-label="move">
          <div id="knob" class="knob"></div>
        </div>
        <div class="btns">
          <button type="button" id="btn-takedown" data-act="takedown">TAKE DOWN</button>
          <button type="button" id="btn-lantern" data-act="lantern">LANTERN</button>
          <button type="button" id="btn-dash" data-act="dash">DASH</button>
          <button type="button" id="btn-flare" data-act="flare">FLARE</button>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
